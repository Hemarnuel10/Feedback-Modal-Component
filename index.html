<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Feedback Modal Component - FrontendPro Challenge</title>
  </head>
  <body>
    <main>
      <button type="button" id="open">Open Survey</button>
    <dialog class="dialog-box">
      <p class="question">How likely are you to recommend FrontendPro to someone you know?</p>
    <div class="inner">
      
      <div class="test">

    </div>
      <div class="rating">
        <button type="button" value="1" class="rating-value">1</button>
        <button type="button" value="2" class="rating-value">2</button>     
        <button type="button" value="3" class="rating-value">3</button>
        <button type="button" value="4" class="rating-value">4</button>
        <button type="button" value="5" class="rating-value">5</button>
        <button type="button" value="6" class="rating-value">6</button>
        <button type="button" value="7" class="rating-value">7</button>
        <button type="button" value="8" class="rating-value">8</button>
        <button type="button" value="9" class="rating-value">9</button>
        <button type="button" value="10" class="rating-value">10</button>
      </div>
      <div class="note">
        <p class="top">Not likely at all</p>
        <p class="down">Extremely likely</p>
      </div>
    </div>
      <div class="options">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="button" id="submit">Submit</button>
      </div>
    </dialog>

    <dialog class="feedback">
      <p>Thanks for the Feedback</p>
      <p id="small-text">You rated FrontendPro <span class="display-rating"></span> out of 10.</p>
      <button type="button" id="cancel-btn">Cancel</button>
    </dialog>
    </main>

    <script src="/src/script.js"></script>
  </body>
</html>
